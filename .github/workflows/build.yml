name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application
        run: dotnet restore src/Rice2k.FolderVault/Rice2k.FolderVault.csproj

      - name: Restore crypto self-test
        run: dotnet restore tests/Rice2k.FolderVault.CryptoSelfTest/Rice2k.FolderVault.CryptoSelfTest.csproj

      - name: Build application
        run: dotnet build src/Rice2k.FolderVault/Rice2k.FolderVault.csproj --configuration Release --no-restore

      - name: Build crypto self-test
        run: dotnet build tests/Rice2k.FolderVault.CryptoSelfTest/Rice2k.FolderVault.CryptoSelfTest.csproj --configuration Release --no-restore

      - name: Run crypto self-test
        run: dotnet run --project tests/Rice2k.FolderVault.CryptoSelfTest/Rice2k.FolderVault.CryptoSelfTest.csproj --configuration Release --no-build
